name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Babel
        run: |
          npm init -y
          npm install --save-dev @babel/core @babel/cli @babel/preset-react

      - name: Build / Pre-compile scripts
        run: |
          mkdir -p dist
          # 5つのファイルを1つに結合して事前にJSへトランスパイル
          cat api.js counter.js settings.js report.js app.js > dist/temp_combined.jsx
          npx babel dist/temp_combined.jsx --out-file dist/bundle.js --presets=@babel/preset-react
          rm dist/temp_combined.jsx

          # 高速配信用にHTMLを調整（Babel本体と個別スクリプト読み込みを排除）
          sed '/<script src="https:\/\/unpkg.com\/@babel\/standalone/d' index.html > dist/index.html
          sed -i '/<script type="text\/babel" src="api.js"><\/script>/c\<script src="bundle.js"><\/script>' dist/index.html
          sed -i '/<script type="text\/babel" src="counter.js"><\/script>/d' dist/index.html
          sed -i '/<script type="text\/babel" src="settings.js"><\/script>/d' dist/index.html
          sed -i '/<script type="text\/babel" src="report.js"><\/script>/d' dist/index.html
          sed -i '/<script type="text\/babel" src="app.js"><\/script>/d' dist/index.html

          # 【追加】画像やPWA関連ファイルを公開用フォルダ(dist)に忘れずコピーする
          cp *.png dist/ 2>/dev/null || true
          cp *.jpg dist/ 2>/dev/null || true
          cp manifest.json dist/ 2>/dev/null || true
          cp sw.js dist/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
