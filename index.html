<!DOCTYPE html>
<html lang="ja" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex">
    <title>山下丸 釣果記録</title>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.22.0/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Boku&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
        .tap-none { -webkit-tap-highlight-color: transparent; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUpModal { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes slideDownModal { from { transform: translateY(-100%); } to { transform: translateY(0); } }
        @keyframes toastFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes flashPort { 0% { background-color: #ef4444; } 100% { background-color: inherit; } }
        @keyframes flashStarboard { 0% { background-color: #10b981; } 100% { background-color: inherit; } }
        @keyframes flashClear { 0% { background-color: #94a3b8; } 100% { background-color: inherit; } }
        .animate-flash-port { animation: flashPort 0.15s ease-out; }
        .animate-flash-starboard { animation: flashStarboard 0.15s ease-out; }
        .animate-flash-clear { animation: flashClear 0.15s ease-out; }
        .animate-color-cycle { animation: colorCycle 4s infinite; }
        @keyframes colorCycle { 0%, 100% { color: #0284c7; } 50% { color: #059669; } }
    </style>
</head>
<body class="bg-gray-100 dark:bg-slate-900 min-h-screen text-gray-900 dark:text-slate-100 transition-colors duration-300">
    <div id="root"></div>

    <!-- 分割された各スクリプトを順番に読み込み -->
    <script type="text/babel" src="api.js"></script>
    <script type="text/babel" src="counter.js"></script>
    <script type="text/babel" src="settings.js"></script>
    <script type="text/babel" src="report.js"></script>
    <script type="text/babel" src="app.js"></script>
</body>
</html>
